name: A11yCC Formal Accessibility Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Unit Tests (Lexer, Parser, Symbol Table, Explicit & ROBDD Symbolic Analyzer)
      run: |
        python -m unittest discover tests -v

    - name: Run 30-Program Academic Benchmark Suite (Precision & Recall Verification)
      run: |
        python eval_suite/run_eval.py

    - name: Verify CLI Commands (Symbolic, Emit HTML, Auto-Repair, Transpiler)
      run: |
        python -m a11ycc check eval_suite/clean/clean_12.dsl --symbolic
        python -m a11ycc repair eval_suite/buggy/buggy_08.dsl --diff
        python -m a11ycc emit eval_suite/clean/clean_01.dsl -o test_output.html
